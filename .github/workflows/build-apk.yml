name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run the build manually from the Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: actions/setup-gradle@v4

      - name: Create local.properties with API Key
        run: |
          echo "GEMINI_API_KEYS=\"${{ secrets.GEMINI_API_KEYS }}\"" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panda-AI-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
